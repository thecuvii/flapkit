name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visuals:
        description: Generate visual baselines for review (does not run the release gate)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check:release
        if: ${{ !inputs.update_visuals }}
      - run: pnpm test:visual --update
        if: ${{ inputs.update_visuals }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_visuals && success() }}
        with:
          name: visual-baselines
          path: tests/__screenshots__/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          include-hidden-files: true
          path: |
            .vitest-attachments/
            tests/__screenshots__/
