packages:
  - website

catalogs:
  dev:
    '@types/node': ^24.3.0
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
    oxfmt: 0.66.0
    oxlint: 1.81.0
    tsdown: 0.23.0
    typescript: 7.0.2
    vite: 8.2.2
    vite-plus: 0.3.0
    vitest: 4.1.0
  frontend:
    next: 16.3.4
    react: 19.2.8
    react-dom: 19.2.8

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@0.3.0

peerDependencyRules:
  allowAny:
    - vite

onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - rolldown-plugin-dts@0.28.5
  - tinyexec@1.3.1
  - tsdown@0.23.0
